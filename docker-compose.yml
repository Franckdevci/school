services:

  mysqldb:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: school_db
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-school-back:
    build: ./
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8089:8089"
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/school_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  app-school-frontend:
    image: mouradhassini/student-front-image:1.0.0
    restart: on-failure
    ports:
      - "8585:85"
    depends_on:
      - app-school-back

volumes:
  db:
